<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Drone Delivery System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .nav {
            margin-top: 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s ease;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 40px;
        }

        .order-list {
            margin-top: 30px;
        }

        .order-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .order-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .order-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-pending {
            background: #2196F3;
            color: white;
        }

        .status-processing {
            background: #ff9800;
            color: white;
        }

        .status-delivered {
            background: #4caf50;
            color: white;
        }

        .status-cancelled {
            background: #f44336;
            color: white;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Order Management</h1>
            <div class="user-info">
                <span>User: {userName}</span>
            </div>
            <div class="nav">
                <a href="/">🏠 Home</a>
                <a href="/drones">🚁 Drones</a>
                <a href="/notifications">🔔 Notifications</a>
                <a href="/logout">🚪 Logout</a>
            </div>
        </div>

        <div class="content">
            <h2>Delivery Orders</h2>

            <div id="orderList" class="order-list">
                <div class="loading">Loading order data...</div>
            </div>
        </div>
    </div>

    <script>
        // Fetch order data from order service
        fetch('/api/orders')
            .then(response => response.json())
            .then(orders => \{
                const orderList = document.getElementById('orderList');
                if (orders && orders.length > 0) \{
                    orderList.innerHTML = orders.map(order => \`
                        <div class="order-card">
                            <h3>📦 Order #\$\{order.id || 'N/A'\}</h3>
                            <p><strong>Customer:</strong> \$\{order.customerName || 'Unknown'\}</p>
                            <p><strong>Destination:</strong> \$\{order.destination || 'N/A'\}</p>
                            <p><strong>Weight:</strong> \$\{order.weight || 0\} kg</p>
                            <p><strong>Created:</strong> \$\{order.createdAt || 'N/A'\}</p>
                            <span class="order-status status-\$\{(order.status || 'pending').toLowerCase()\}">
                                \$\{order.status || 'PENDING'\}
                            </span>
                        </div>
                    \`).join('');
                \} else \{
                    orderList.innerHTML = '<div class="loading">No orders available</div>';
                \}
            \})
            .catch(error => \{
                console.error('Error fetching orders:', error);
                document.getElementById('orderList').innerHTML =
                    '<div class="loading">Error loading order data. Please try again later.</div>';
            \});
    </script>
</body>
</html>
