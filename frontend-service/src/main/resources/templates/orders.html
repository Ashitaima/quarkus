<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Drone Delivery System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .nav {
            margin-top: 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s ease;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 40px;
        }

        .order-list {
            margin-top: 30px;
        }

        .order-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .order-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .order-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-pending {
            background: #2196F3;
            color: white;
        }

        .status-processing {
            background: #ff9800;
            color: white;
        }

        .status-delivered {
            background: #4caf50;
            color: white;
        }

        .status-cancelled {
            background: #f44336;
            color: white;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Order Management</h1>
            <div class="user-info">
                <span>User: {userName}</span>
            </div>
            <div class="nav">
                <a href="/">🏠 Home</a>
                <a href="/drones">🚁 Drones</a>
                <a href="/notifications">🔔 Notifications</a>
                <a href="/logout">🚪 Logout</a>
            </div>
        </div>

        <div class="content">
            <h2>Delivery Orders</h2>

            <!-- Create Order Form -->
            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px; margin-bottom: 30px;">
                <h3 style="margin-bottom: 15px;">➕ Create New Order</h3>
                <form id="createOrderForm" style="display: grid; gap: 15px; max-width: 600px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Customer Name:</label>
                        <input type="text" id="customerName" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Destination Address:</label>
                        <input type="text" id="destination" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Weight (kg):</label>
                        <input type="number" id="weight" step="0.1" min="0.1" max="10" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <button type="submit" style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                        Create Order
                    </button>
                </form>
                <div id="createOrderMessage" style="margin-top: 15px; padding: 10px; border-radius: 5px;"></div>
            </div>

            <div id="orderList" class="order-list">
                <div class="loading">Loading order data...</div>
            </div>
        </div>
    </div>

    <script>
        // Function to load orders
        function loadOrders() {
            const controller = new AbortController();
            const timeoutId = setTimeout(function() { controller.abort(); }, 5000);

            fetch('/api/orders', { signal: controller.signal })
                .then(function(response) {
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(function(orders) {
                    const orderList = document.getElementById('orderList');
                    if (orders && orders.length > 0) {
                        orderList.innerHTML = orders.map(function(order) {
                            return '<div class="order-card" id="order-' + order.id + '">' +
                                '<h3>📦 Order #' + (order.id || 'N/A') + '</h3>' +
                                '<p><strong>Customer:</strong> ' + (order.customerName || 'Unknown') + '</p>' +
                                '<p><strong>Destination:</strong> ' + (order.destination || 'N/A') + '</p>' +
                                '<p><strong>Weight:</strong> ' + (order.weight || 0) + ' kg</p>' +
                                '<p><strong>Created:</strong> ' + (order.createdAt || 'N/A') + '</p>' +
                                '<span class="order-status status-' + (order.status || 'pending').toLowerCase() + '">' +
                                    (order.status || 'PENDING') +
                                '</span>' +
                                '<div style="margin-top: 15px;">' +
                                    '<button onclick="editOrder(' + order.id + ', \'' + (order.customerName || '') + '\', \'' + (order.destination || '') + '\', ' + (order.weight || 0) + ', \'' + (order.status || 'PENDING') + '\')" style="padding: 8px 16px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px;">Edit</button>' +
                                    '<button onclick="deleteOrder(' + order.id + ')" style="padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">Delete</button>' +
                                '</div>' +
                            '</div>';
                        }).join('');
                    } else {
                        orderList.innerHTML = '<div class="loading">No orders available</div>';
                    }
                })
                .catch(function(error) {
                    clearTimeout(timeoutId);
                    console.error('Error fetching orders:', error);
                    const orderList = document.getElementById('orderList');
                    orderList.innerHTML = '<div class="loading" style="color: #f44336;">' +
                        (error.name === 'AbortError' ?
                            '⚠️ Request timeout - Order service may not be running' :
                            '❌ Error loading order data') + '<br>' +
                        '<small>' + error.message + '</small><br>' +
                        '<button onclick="loadOrders()" style="margin-top:10px;padding:8px 16px;cursor:pointer;">Retry</button>' +
                        '</div>';
                });
        }

        // Handle create order form submission
        document.getElementById('createOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const messageDiv = document.getElementById('createOrderMessage');
            messageDiv.innerHTML = '<div style="color: #2196F3;">Creating order...</div>';

            const orderData = {
                customerName: document.getElementById('customerName').value,
                destination: document.getElementById('destination').value,
                weight: parseFloat(document.getElementById('weight').value),
                status: 'PENDING'
            };

            fetch('/api/orders', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderData)
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to create order');
                return response.json();
            })
            .then(function(data) {
                messageDiv.innerHTML = '<div style="color: #4caf50; background: #e8f5e9; padding: 10px; border-radius: 5px;">' +
                    '✅ Order created successfully! ID: ' + (data.id || 'N/A') +
                    '</div>';
                document.getElementById('createOrderForm').reset();
                // Reload orders list
                setTimeout(loadOrders, 1000);
            })
            .catch(function(error) {
                messageDiv.innerHTML = '<div style="color: #f44336; background: #ffebee; padding: 10px; border-radius: 5px;">' +
                    '❌ Error creating order: ' + error.message +
                    '</div>';
            });
        });

        // Function to edit order
        function editOrder(id, customerName, destination, weight, status) {
            const newCustomerName = prompt('Edit Customer Name:', customerName);
            if (newCustomerName === null) return;

            const newDestination = prompt('Edit Destination:', destination);
            if (newDestination === null) return;

            const newWeight = prompt('Edit Weight (kg):', weight);
            if (newWeight === null) return;

            const newStatus = prompt('Edit Status (PENDING/SCHEDULED/DELIVERED/CANCELED):', status);
            if (newStatus === null) return;

            const orderData = {
                customerName: newCustomerName || customerName,
                destination: newDestination || destination,
                weight: parseFloat(newWeight) || weight,
                status: newStatus.toUpperCase() || status
            };

            fetch('/api/orders/' + id, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderData)
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to update order');
                return response.json();
            })
            .then(function(data) {
                alert('Order updated successfully!');
                loadOrders();
            })
            .catch(function(error) {
                alert('Error updating order: ' + error.message);
            });
        }

        // Function to delete order
        function deleteOrder(id) {
            if (!confirm('Are you sure you want to delete order #' + id + '?')) {
                return;
            }

            fetch('/api/orders/' + id, {
                method: 'DELETE'
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to delete order');
                const orderCard = document.getElementById('order-' + id);
                if (orderCard) {
                    orderCard.style.opacity = '0';
                    setTimeout(function() {
                        orderCard.remove();
                    }, 300);
                }
            })
            .catch(function(error) {
                alert('Error deleting order: ' + error.message);
            });
        }

        // Load orders on page load
        loadOrders();
    </script>
</body>
</html>
