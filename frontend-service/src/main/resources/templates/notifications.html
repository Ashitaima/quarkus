<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Drone Delivery System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .nav {
            margin-top: 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s ease;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 40px;
        }

        .notification-list {
            margin-top: 30px;
        }

        .notification-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: flex-start;
        }

        .notification-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .notification-icon {
            font-size: 2rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .notification-content {
            flex-grow: 1;
        }

        .notification-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notification-message {
            color: #666;
            margin-bottom: 10px;
        }

        .notification-time {
            font-size: 0.9rem;
            color: #999;
        }

        .notification-type {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .type-info {
            background: #2196F3;
            color: white;
        }

        .type-success {
            background: #4caf50;
            color: white;
        }

        .type-warning {
            background: #ff9800;
            color: white;
        }

        .type-error {
            background: #f44336;
            color: white;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 Notifications</h1>
            <div class="user-info">
                <span>User: {userName}</span>
            </div>
            <div class="nav">
                <a href="/">🏠 Home</a>
                <a href="/drones">🚁 Drones</a>
                <a href="/orders">📦 Orders</a>
                <a href="/logout">🚪 Logout</a>
            </div>
        </div>

        <div class="content">
            <h2>System Notifications</h2>

            <!-- Create Notification Form -->
            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px; margin-bottom: 30px;">
                <h3 style="margin-bottom: 15px;">➕ Create New Notification</h3>
                <form id="createNotificationForm" style="display: grid; gap: 15px; max-width: 600px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Title:</label>
                        <input type="text" id="notifTitle" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Message:</label>
                        <textarea id="notifMessage" required rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Type:</label>
                        <select id="notifType" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                            <option value="info">Info</option>
                            <option value="success">Success</option>
                            <option value="warning">Warning</option>
                            <option value="error">Error</option>
                        </select>
                    </div>
                    <button type="submit" style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                        Create Notification
                    </button>
                </form>
                <div id="createNotificationMessage" style="margin-top: 15px;"></div>
            </div>

            <h3>All Notifications</h3>
            <div id="notificationList" class="notification-list">
                <div class="loading">Loading notifications...</div>
            </div>
        </div>
    </div>

    <script>
        // Function to load notifications
        function loadNotifications() {
            const controller = new AbortController();
            const timeoutId = setTimeout(function() { controller.abort(); }, 5000);

            fetch('/api/notifications', { signal: controller.signal })
                .then(function(response) {
                    clearTimeout(timeoutId);
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(notifications) {
                    const notificationList = document.getElementById('notificationList');
                    if (notifications && notifications.length > 0) {
                        notificationList.innerHTML = notifications.map(function(notif) {
                            return '<div class="notification-card" id="notif-' + (notif.id || '') + '">' +
                                '<div class="notification-icon">' +
                                    (notif.type === 'success' ? '✅' :
                                     notif.type === 'warning' ? '⚠️' :
                                     notif.type === 'error' ? '❌' : 'ℹ️') +
                                '</div>' +
                                '<div class="notification-content">' +
                                    '<div class="notification-title">' + (notif.title || 'Notification') + '</div>' +
                                    '<div class="notification-message">' + (notif.message || 'No message') + '</div>' +
                                    '<div class="notification-time">' + (notif.timestamp || 'Recent') + '</div>' +
                                    '<span class="notification-type type-' + (notif.type || 'info') + '">' +
                                        (notif.type || 'info').toUpperCase() +
                                    '</span>' +
                                    '<div style="margin-top: 15px;">' +
                                        '<button onclick="deleteNotification(\'' + (notif.id || '') + '\')" style="padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">Delete</button>' +
                                    '</div>' +
                                '</div>' +
                            '</div>';
                        }).join('');
                    } else {
                        notificationList.innerHTML = '<div class="loading">No notifications available</div>';
                    }
                })
                .catch(function(error) {
                    clearTimeout(timeoutId);
                    console.error('Error fetching notifications:', error);
                    const notificationList = document.getElementById('notificationList');

                    if (error.name === 'AbortError') {
                        notificationList.innerHTML = '<div class="loading" style="color: #f44336;">' +
                            '⚠️ Request timeout - Notification service may not be running<br>' +
                            '<small>Please check if notification-service is started</small><br>' +
                            '<button onclick="loadNotifications()" style="margin-top:10px;padding:8px 16px;cursor:pointer;">Retry</button>' +
                            '</div>';
                    } else {
                        notificationList.innerHTML = '<div class="loading" style="color: #f44336;">' +
                            '❌ Error loading notifications<br>' +
                            '<small>Error: ' + error.message + '</small><br>' +
                            '<button onclick="loadNotifications()" style="margin-top:10px;padding:8px 16px;cursor:pointer;">Retry</button>' +
                            '</div>';
                    }
                });
        }

        // Handle create notification form submission
        document.getElementById('createNotificationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const messageDiv = document.getElementById('createNotificationMessage');
            messageDiv.innerHTML = '<div style="color: #2196F3;">Creating notification...</div>';

            const notificationData = {
                title: document.getElementById('notifTitle').value,
                message: document.getElementById('notifMessage').value,
                type: document.getElementById('notifType').value,
                timestamp: new Date().toISOString()
            };

            fetch('/api/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(notificationData)
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to create notification');
                return response.json();
            })
            .then(function(data) {
                messageDiv.innerHTML = '<div style="color: #4caf50; background: #e8f5e9; padding: 10px; border-radius: 5px;">' +
                    '✅ Notification created successfully!' +
                    '</div>';
                document.getElementById('createNotificationForm').reset();
                setTimeout(loadNotifications, 1000);
            })
            .catch(function(error) {
                messageDiv.innerHTML = '<div style="color: #f44336; background: #ffebee; padding: 10px; border-radius: 5px;">' +
                    '❌ Error creating notification: ' + error.message +
                    '</div>';
            });
        });

        // Function to delete notification
        function deleteNotification(id) {
            if (!confirm('Are you sure you want to delete this notification?')) {
                return;
            }

            fetch('/api/notifications/' + id, {
                method: 'DELETE'
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to delete notification');
                const notifCard = document.getElementById('notif-' + id);
                if (notifCard) {
                    notifCard.style.opacity = '0';
                    setTimeout(function() {
                        notifCard.remove();
                    }, 300);
                }
            })
            .catch(function(error) {
                alert('Error deleting notification: ' + error.message);
            });
        }

        // Load notifications on page load
        loadNotifications();
    </script>
</body>
</html>
