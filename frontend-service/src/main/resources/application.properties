# HTTP Configuration
quarkus.http.port=8080

# OIDC Configuration for Dev Mode
quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus
quarkus.oidc.client-id=frontend-service
quarkus.oidc.credentials.secret=vt1Ptaaa37RrvBpd7DzXpJDNa2x1H4iT
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.scopes=openid,profile,email
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.force-redirect-https-scheme=false

# Logout configuration
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# Dev Services - Disabled, using Docker Compose Keycloak
quarkus.keycloak.devservices.enabled=false
# quarkus.keycloak.devservices.realm-path=quarkus-realm.json

# OIDC Token configuration
quarkus.oidc.token.issuer=any
quarkus.oidc.token.verify-access-token-with-user-info=false

# REST Client for Management Service
quarkus.rest-client.management-api.url=http://localhost:8081
quarkus.rest-client.management-api.scope=jakarta.inject.Singleton

# REST Client for Order Service
quarkus.rest-client.order-api.url=http://localhost:8082
quarkus.rest-client.order-api.scope=jakarta.inject.Singleton

# REST Client for Notification Service
quarkus.rest-client.notification-api.url=http://localhost:8083
quarkus.rest-client.notification-api.scope=jakarta.inject.Singleton

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO

# Production Profile
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus
%prod.quarkus.oidc.client-id=frontend-service
%prod.quarkus.oidc.credentials.secret=vt1Ptaaa37RrvBpd7DzXpJDNa2x1H4iT
%prod.quarkus.keycloak.devservices.enabled=false
